<!DOCTYPE html>
<html>
<head>
  <title>Painel CNPJ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f4f6f9;
    }

    .sidebar {
      width: 220px;
      height: 100vh;
      background: #1f2d3d;
      color: white;
      position: fixed;
      padding: 20px;
    }

    .sidebar h2 {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .sidebar a {
      display: block;
      color: #ccc;
      margin-bottom: 15px;
      text-decoration: none;
    }

    .main {
      margin-left: 240px;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .site-item {
      background: #f1f1f1;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      width: 90%;
      max-width: 400px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>🚀 Painel</h2>
  <a href="#">Meus Sites</a>
  <a href="#">Configurações</a>
</div>

<div class="main">

  <div class="card">
    <h2>Meus Sites</h2>

    <button onclick="abrirModal()">+ Criar novo site</button>

    <div id="lista"></div>
  </div>

</div>

<div class="modal" id="modal">
  <div class="modal-content">

    <h3>Criar Site</h3>

    <input id="cnpj" placeholder="Digite o CNPJ">
    <button onclick="buscar()">Buscar dados</button>

    <div id="dados" style="margin-top:10px;"></div>

    <input id="telefone" placeholder="Telefone">
    <input id="metatag" placeholder="MetaTag">

    <button onclick="salvar()" style="margin-top:10px;">Criar Site</button>

    <button onclick="fecharModal()" style="background:red; margin-top:10px;">Fechar</button>

  </div>
</div>

<script>

let dadosGlobal = {}

function abrirModal() {
  document.getElementById("modal").style.display = "flex"
}

function fecharModal() {
  document.getElementById("modal").style.display = "none"
}

async function buscar() {
  let cnpj = document.getElementById("cnpj").value

  document.getElementById("dados").innerHTML = "🔄 Buscando..."

  try {
    let res = await fetch(`/api/cnpj?cnpj=${cnpj}`)
    let data = await res.json()

    dadosGlobal = data

    document.getElementById("dados").innerHTML = `
      <b>${data.razao_social}</b><br>
      ${data.municipio} - ${data.uf}
    `
  } catch {
    document.getElementById("dados").innerHTML = "❌ Erro ao buscar"
  }
}

async function salvar() {
  let telefone = document.getElementById("telefone").value
  let metatag = document.getElementById("metatag").value
  let cnpj = document.getElementById("cnpj").value

  document.getElementById("dados").innerHTML = "🚀 Criando..."

  await fetch("/api/salvar", {
    method: "POST",
    body: JSON.stringify({
      cnpj,
      telefone,
      metatag,
      razao_social: dadosGlobal.razao_social
    })
  })

  document.getElementById("dados").innerHTML = "✅ Criado!"

  adicionarLista(dadosGlobal.razao_social)

  fecharModal()
}

function adicionarLista(nome) {
  let lista = document.getElementById("lista")

  lista.innerHTML += `
    <div class="site-item">
      ${nome}
    </div>
  `
}

</script>

</body>
</html>
