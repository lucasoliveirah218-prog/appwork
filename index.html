<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#f5f7fb;
}

/* SIDEBAR */
.sidebar {
  width:240px;
  height:100vh;
  background:#1e2a38;
  color:#fff;
  position:fixed;
  padding:20px;
}

.sidebar h2 {
  font-size:18px;
  margin-bottom:20px;
}

.sidebar a {
  display:block;
  padding:10px;
  border-radius:8px;
  margin-bottom:10px;
  color:#cfd8dc;
  text-decoration:none;
}

.sidebar a.active {
  background:#2f80ed;
  color:#fff;
}

/* MAIN */
.main {
  margin-left:260px;
  padding:20px;
}

/* HEADER */
.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.btn {
  background:#2f80ed;
  color:white;
  padding:10px 15px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* CARD */
.card {
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

/* LIST */
.site {
  padding:15px;
  background:#f1f3f7;
  margin-top:10px;
  border-radius:8px;
}

/* MODAL */
.modal {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box {
  background:white;
  padding:20px;
  width:90%;
  max-width:400px;
  border-radius:12px;
}

/* INPUT */
input {
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

/* PROGRESS */
.progress {
  height:6px;
  background:#eee;
  border-radius:6px;
  margin:10px 0;
}

.progress-bar {
  height:100%;
  width:50%;
  background:#2f80ed;
  border-radius:6px;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>🚀 Painel</h2>
  <a class="active">Gerador de Sites</a>
  <a>Números</a>
  <a>Email</a>
</div>

<div class="main">

  <div class="header">
    <h2>Meus Sites</h2>
    <button class="btn" onclick="abrir()">+ Criar novo site</button>
  </div>

  <div class="card">
    <div id="lista"></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">

    <h3>Novo site</h3>

    <div class="progress">
      <div class="progress-bar"></div>
    </div>

    <input id="cnpj" placeholder="CNPJ">
    <button class="btn" onclick="buscar()">Conectar</button>

    <div id="dados"></div>

    <input id="dominio" placeholder="Dominio (ex: empresa)">
    <input id="telefone" placeholder="Telefone">
    <input id="metatag" placeholder="Meta Tag">

    <button class="btn" onclick="salvar()">Criar site</button>
    <button onclick="fechar()">Fechar</button>

  </div>
</div>

<script>

let dadosGlobal = {}

function abrir(){
  document.getElementById("modal").style.display="flex"
}

function fechar(){
  document.getElementById("modal").style.display="none"
}

async function buscar(){
  let cnpj = document.getElementById("cnpj").value
  document.getElementById("dados").innerHTML="Buscando..."

  try{
    let res = await fetch(`/api/cnpj?cnpj=${cnpj}`)
    let data = await res.json()

    dadosGlobal = data

    document.getElementById("dados").innerHTML = `
      <b>${data.razao_social}</b><br>
      ${data.municipio} - ${data.uf}
    `
  }catch{
    document.getElementById("dados").innerHTML="Erro ao buscar"
  }
}

async function salvar(){
  let telefone = document.getElementById("telefone").value
  let metatag = document.getElementById("metatag").value
  let cnpj = document.getElementById("cnpj").value

  await fetch("/api/salvar",{
    method:"POST",
    body:JSON.stringify({
      cnpj,
      telefone,
      metatag,
      razao_social: dadosGlobal.razao_social
    })
  })

  adicionar(dadosGlobal.razao_social)

  fechar()
}

function adicionar(nome){
  let lista = document.getElementById("lista")

  lista.innerHTML += `
    <div class="site">
      ${nome}
    </div>
  `
}

</script>

</body>
</html>
